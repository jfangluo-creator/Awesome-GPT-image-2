name: Collect Daily YouMind Cases

on:
  # 每天北京时间 03:00（UTC 19:00 前一天）
  schedule:
    - cron: '0 19 * * *'
  # 手动触发（用于测试）
  workflow_dispatch:
    inputs:
      date:
        description: '日期 (YYYY-MM-DD)，留空则取昨天'
        required: false
        type: string
      count:
        description: '最大收录数量'
        required: false
        default: '200'
        type: string

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect cases
        run: |
          ARGS="--ci --count ${{ inputs.count || '200' }} --no-push"
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          node scripts/collect-today.mjs $ARGS

      - name: Push changes
        run: git push

      - name: Trigger Gallery Deploy
        if: success()
        run: |
          HTTP_CODE=$(curl -s -o /tmp/trigger_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-gallery.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy workflow triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ Failed to trigger deploy (HTTP $HTTP_CODE)"
            cat /tmp/trigger_resp.json
            exit 1
          fi

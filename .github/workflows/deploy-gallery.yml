name: Deploy Gallery to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'images/**'
      - '.github/workflows/deploy-gallery.yml'
      - '.github/workflows/collect-daily.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: cd site && npm ci

      # 根目录 images/ 为唯一原图源；CI 上重建 symlink（本地是 junction）
      # 否则 site/public/images 只有早期提交的副本，新案例缩略图会全部失败
      - name: Link repo images into site/public
        run: |
          rm -rf site/public/images
          ln -s ../../images site/public/images
          test -e site/public/images
          echo "linked images: $(find site/public/images -type f | wc -l) files"

      - name: Parse cases
        run: cd site && npm run parse

      - name: Generate thumbnails
        run: cd site && npm run thumbs

      - name: Build
        run: cd site && npx astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
